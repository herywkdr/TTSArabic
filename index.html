<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muntiqu – TTS Monolog & Dialog Arab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Scheherazade+New:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#047857;--gd:#064e3b;--bg:#f6f7f5;--bd:#dfe3dc;--mut:#667085;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:#1d2939}
header{background:var(--gd);color:#fff;padding:16px}
header>div,main{max-width:1100px;margin:0 auto}
h1{margin:0;font-size:22px}h1 small{font-weight:400;opacity:.7;font-size:14px;margin-left:8px}
main{padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:380px 1fr;align-items:start}}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
input,select,textarea,button{font:inherit}
input,select{width:100%;margin-top:3px;padding:8px 10px;border:1px solid #cfd5cc;border-radius:8px;background:#fff;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.char{background:#fafbf9;margin-bottom:8px}
.ico{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.ico:hover{color:var(--err);background:#fee4e2}
.btn{border:1px solid #cfd5cc;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--g);color:var(--g)}
.add{width:100%;border-style:dashed}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:#eef0ec;padding:3px;border-radius:8px}
.seg button{flex:1;min-width:60px;border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--mut)}
.seg button[aria-pressed=true]{background:#fff;color:var(--g);font-weight:600;box-shadow:0 1px 2px #0002}
.badge{display:inline-block;background:#d1fae5;color:var(--gd);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.hint{font-size:12px;color:var(--mut);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--g);color:var(--g);background:#ecfdf5;border-radius:20px;padding:3px 12px;cursor:pointer;font-size:12px}
textarea{width:100%;min-height:260px;padding:14px;border:1px solid #cfd5cc;border-radius:8px;resize:vertical;font:22px/2.1 "Scheherazade New",serif;direction:rtl;text-align:right}
.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.go:hover{background:var(--gd)}
.cancel{background:#fff;color:var(--err);border:1px solid var(--err)}
.cancel:hover{background:#fee4e2}
.bar{height:6px;background:#e4e7e0;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
.err{background:#fef3f2;border:1px solid #fecdca;color:var(--err);padding:10px;border-radius:8px;margin-top:10px}
[hidden]{display:none!important}
audio{width:100%;margin:8px 0}
.hi{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.hi .t{flex:1;min-width:0}.hi .a{font:18px "Scheherazade New",serif;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .m{font-size:11px;color:var(--mut)}
code{background:#eef0ec;padding:1px 5px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div><h1>Muntiqu<small>منطق · TTS Monolog & Dialog Arab Fusha</small></h1></div></header>
<main>
<aside>
  <section class="card">
    <h2>API Key Gemini</h2>
    <label>Kunci disimpan hanya di browser Anda
      <input type="password" id="key" autocomplete="off" placeholder="Tempel API Key di sini">
    </label>
    <p class="hint" style="margin:0">Gratis di <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>.</p>
  </section>
  <section class="card">
    <h2>Karakter <span class="badge" id="mode"></span></h2>
    <div id="chars"></div>
    <button class="btn add" id="add">+ Tambah karakter</button>
  </section>
  <section class="card">
    <h2>Gaya bicara</h2>
    <label>Kecepatan</label><div class="seg" id="speed" style="margin-bottom:10px"></div>
    <div class="g2">
      <label>Jeda koma (،)<select id="comma"></select></label>
      <label>Jeda titik (.)<select id="period"></select></label>
    </div>
    <label>Jeda antar-bagian/pembicara<select id="gap"></select></label>
  </section>
</aside>

<section>
  <div class="card">
    <div class="row"><h2 style="margin:0">Naskah</h2><button class="btn" id="tpl">Isi contoh</button></div>
    <p class="hint" id="info"></p>
    <div class="chips" id="chips" aria-label="Sisipkan nama pembicara"></div>
    <textarea id="script" dir="rtl" placeholder="اكتب النص العربي هنا…" aria-label="Naskah Arab"></textarea>
    <div class="hint row"><span id="stat"></span><span>Ctrl + Enter untuk memproses</span></div>
    <div class="err" id="err" role="alert" hidden></div>
    <button class="go" id="go">Hasilkan suara</button>
    <div id="prog" hidden aria-live="polite"><div class="bar"><i id="pbar"></i></div><div class="hint" id="ptxt"></div></div>
  </div>
  <div class="card" id="out" hidden>
    <h2>Hasil terbaru</h2>
    <audio id="player" controls></audio>
    <button class="btn" id="dl">Unduh WAV</button>
  </div>
  <div class="card" id="hist" hidden><h2>Riwayat sesi ini</h2><div id="hlist"></div></div>
</section>
</main>

<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='background:#fef3f2;color:#b42318;padding:12px;margin:12px;border:1px solid #fecdca;border-radius:8px';d.textContent='Kesalahan skrip: '+e.message;document.body.prepend(d)});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MODEL='gemini-2.5-flash-preview-tts';
const ENDPOINT=`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

const VOICES=[
 {g:'Pria',n:'Charon',l:'Charon – tegas & berat'},{g:'Pria',n:'Fenrir',l:'Fenrir – bersemangat'},{g:'Pria',n:'Orus',l:'Orus – berwibawa'},
 {g:'Wanita',n:'Kore',l:'Kore – jelas & lantang'},{g:'Wanita',n:'Aoede',l:'Aoede – lembut & tenang'},{g:'Wanita',n:'Leda',l:'Leda – muda & ceria'}];
const EMO=[
 ['normal','Normal','natural and conversational'],['kalem','Kalem','calm, relaxed and soothing'],['marah','Marah','angry and stern'],
 ['sedih','Sedih','sad and melancholic'],['senang','Senang','happy and cheerful'],['dramatis','Dramatis','highly dramatic and theatrical'],
 ['resmi','Resmi','formal and authoritative'],['berita','Pembaca berita','like a professional news anchor'],
 ['announcer','Announcer','like a public address announcer'],['pengajar','Pengajar','like a patient, articulate teacher'],
 ['terkejut','Terkejut','surprised and shocked'],['perasa','Perasa','deeply emotional and touching']].map(([id,l,p])=>({id,l,p}));
const SPD=[['sangat_lambat','Sangat lambat','at a very slow, deliberate pace'],['lambat','Lambat','at a slow pace'],['normal','Normal','at a normal pace'],['cepat','Cepat','at a fast pace'],['sangat_cepat','Sangat cepat','at a very fast pace']].map(([id,l,p])=>({id,l,p}));
const CM=[['singkat','Singkat (0.3 dtk)','a brief pause'],['normal','Normal (0.6 dtk)','a normal pause'],['lama','Lama (1 dtk)','a distinct pause']].map(([id,l,p])=>({id,l,p}));
const PD=[['normal','Normal (1 dtk)','a normal sentence break'],['lama','Lama (1.5 dtk)','a long sentence break'],['sangat_lama','Sangat lama (2.5 dtk)','a very long sentence break']].map(([id,l,p])=>({id,l,p}));
const GAPS=[[300,'Singkat (0.3 dtk)'],[600,'Normal (0.6 dtk)'],[1000,'Lama (1 dtk)'],[1500,'Sangat lama (1.5 dtk)']];

const S={chars:[{id:uid(),name:'Tariq',voice:'Charon',emo:'normal'},{id:uid(),name:'Aisha',voice:'Aoede',emo:'normal'}],speed:'normal',comma:'normal',period:'normal',gap:600};
let busy=false,ac=null,curBlob=null,hist=[];

/* ---------- penyimpanan ---------- */
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('muntiqu',JSON.stringify({k:$('key').value,S,t:$('script').value}))}catch{}},400)}
function load(){try{const d=JSON.parse(localStorage.getItem('muntiqu')||'null');if(d){Object.assign(S,d.S||{});$('key').value=d.k||'';$('script').value=d.t||''}}catch{}}

/* ---------- UI ---------- */
const opts=(arr,sel)=>arr.map(o=>`<option value="${o.id}"${o.id===sel?' selected':''}>${esc(o.l)}</option>`).join('');
function renderChars(){
 $('chars').innerHTML=S.chars.map((c,i)=>`<div class="card char" data-id="${c.id}">
  <div class="row"><b>Pembicara ${i+1}</b><button class="ico" data-del title="Hapus karakter" aria-label="Hapus pembicara ${i+1}">✕</button></div>
  <div class="g2" style="margin-top:8px"><label>Nama<input data-f="name" value="${esc(c.name)}" maxlength="20"></label>
  <label>Suara<select data-f="voice">${['Pria','Wanita'].map(g=>`<optgroup label="${g}">${VOICES.filter(v=>v.g===g).map(v=>`<option value="${v.n}"${v.n===c.voice?' selected':''}>${v.l}</option>`).join('')}</optgroup>`).join('')}</select></label></div>
  <label style="margin:0">Emosi<select data-f="emo">${opts(EMO,c.emo)}</select></label></div>`).join('');
 renderChips();updateMode();
}
function renderChips(){$('chips').innerHTML=S.chars.map(c=>`<button type="button" data-n="${esc(c.name)}">${esc(c.name)}</button>`).join('')}
function updateMode(){
 const n=S.chars.length,solo=n===1;
 $('mode').textContent=solo?'Monolog':n===2?'Dialog':`Dialog ${n} orang`;
 $('chips').hidden=solo;
 $('info').innerHTML=solo?'Tulis teks Arab langsung, tanpa nama pembicara.':'Awali setiap giliran dengan <code>Nama: teks Arab</code>. Baris tanpa nama dianggap lanjutan pembicara sebelumnya.';
 stat();
}
function fillSeg(){
 $('speed').innerHTML=SPD.map(s=>`<button type="button" data-s="${s.id}" aria-pressed="${s.id===S.speed}">${s.l}</button>`).join('');
 $('comma').innerHTML=opts(CM,S.comma);$('period').innerHTML=opts(PD,S.period);
 $('gap').innerHTML=GAPS.map(([v,l])=>`<option value="${v}"${v===S.gap?' selected':''}>${l}</option>`).join('');
}
function stat(){
 const t=$('script').value;let extra='';
 try{const j=buildJobs(parse(t));if(j.length)extra=` · ±${j.length} permintaan API`}catch{}
 $('stat').textContent=`${t.length} karakter${extra}`;
}
function showErr(m){$('err').textContent=m;$('err').hidden=false}
function template(){
 const c=S.chars;
 if(c.length===1)return 'أَهْلًا وَسَهْلًا بِكُمْ فِي نَشْرَةِ الْأَخْبَارِ. نُقَدِّمُ لَكُمُ الْيَوْمَ أَهَمَّ الْأَحْدَاثِ. شُكْرًا لِإِصْغَائِكُمْ.';
 const L=['السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ','وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ. كَيْفَ حَالُكُمْ؟','أَنَا بِخَيْرٍ وَالْحَمْدُ لِلَّهِ. هَلْ أَنْتُمْ مُسْتَعِدُّونَ لِلدَّرْسِ؟','نَعَمْ، بِكُلِّ تَأْكِيدٍ.'];
 return L.map((t,i)=>`${c[i%c.length].name}: ${t}`).join('\n');
}

/* ---------- parsing naskah ---------- */
function parse(text){
 const solo=S.chars.length===1,names=S.chars.map(c=>c.name.trim().toLowerCase()),segs=[];
 text.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
  const m=l.match(/^([^:：]{1,20}?)\s*[:：]\s*(.*)$/);let sp=null,t=l;
  if(m&&!/[\u0600-\u06FF]/.test(m[1])){
   const k=names.indexOf(m[1].trim().toLowerCase());
   if(k>-1){sp=S.chars[k].name.trim();t=m[2]}
   else if(!solo)throw new Error(`Baris ${i+1}: pembicara "${m[1]}" belum ada di pengaturan karakter.`);
  }
  if(solo)sp=S.chars[0].name.trim();
  if(!sp){if(!segs.length)throw new Error(`Baris ${i+1}: awali dengan "Nama: teks".`);sp=segs[segs.length-1].speaker}
  if(!t.trim())return;
  const last=segs[segs.length-1];
  if(last&&last.speaker===sp)last.text+=' '+t;else segs.push({speaker:sp,text:t});
 });
 return segs;
}
function chunk(t,max=600){
 const out=[];let cur='';
 for(const s of t.replace(/([.!?؟…])\s+/g,'$1\n').split('\n')){if(cur&&(cur+' '+s).length>max){out.push(cur);cur=s}else cur=cur?cur+' '+s:s}
 if(cur)out.push(cur);return out;
}
/* 1 pembicara & 3+ pembicara: satu suara per permintaan. Tepat 2 pembicara: mode multi-speaker Gemini (maks. 2). */
function buildJobs(segs){
 const used=[...new Set(segs.map(s=>s.speaker))],J=[];
 const single=(sp,t)=>chunk(t).forEach(x=>J.push({sp:[sp],text:x}));
 if(used.length===2){
  let b=[],n=0;
  const flush=()=>{if(!b.length)return;const u=[...new Set(b.map(x=>x.speaker))];
   if(u.length===2)J.push({sp:u,text:b.map(x=>`${x.speaker}: ${x.text}`).join('\n')});else b.forEach(x=>single(x.speaker,x.text));b=[];n=0};
  segs.forEach(s=>{if(n+s.text.length>1200)flush();b.push(s);n+=s.text.length});flush();
 }else segs.forEach(s=>single(s.speaker,s.text));
 return J;
}

/* ---------- Gemini TTS ---------- */
const ch=n=>S.chars.find(c=>c.name.trim()===n);
const pick=(a,id)=>a.find(x=>x.id===id);
function prompt(j){
 const pace=`${pick(SPD,S.speed).p}, with ${pick(CM,S.comma).p} at commas and ${pick(PD,S.period).p} at full stops`;
 if(j.sp.length===1)return `Say in Modern Standard Arabic (Fusha), ${pick(EMO,ch(j.sp[0]).emo).p}, ${pace}:\n\n${j.text}`;
 return `Make ${j.sp.map(n=>`${n} sound ${pick(EMO,ch(n).emo).p}`).join(' and ')}. Speak in Modern Standard Arabic (Fusha), ${pace}:\n\n${j.text}`;
}
async function tts(j,key,signal){
 const vc=n=>({prebuiltVoiceConfig:{voiceName:ch(n).voice}});
 const speechConfig=j.sp.length===1?{voiceConfig:vc(j.sp[0])}:{multiSpeakerVoiceConfig:{speakerVoiceConfigs:j.sp.map(n=>({speaker:n,voiceConfig:vc(n)}))}};
 const body=JSON.stringify({contents:[{parts:[{text:prompt(j)}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig}});
 for(let a=0;a<4;a++){
  if(signal.aborted)throw new DOMException('abort','AbortError');
  const r=await fetch(ENDPOINT,{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body});
  if(r.ok){
   const p=(await r.json())?.candidates?.[0]?.content?.parts?.[0]?.inlineData;
   if(p?.data){
    const bin=atob(p.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return{pcm:new Int16Array(u.buffer,0,u.byteLength>>1),rate:+((p.mimeType||'').match(/rate=(\d+)/)||[])[1]||24000};
   }
  }else if(r.status===400||r.status===401||r.status===403){
   const m=(await r.json().catch(()=>({}))).error?.message||'';
   throw new Error(/API key/i.test(m)?'API Key tidak valid. Periksa kembali kunci Anda.':`Permintaan ditolak (${r.status}). ${m}`);
  }
  await sleep(1500*2**a); // 429 / 5xx / audio kosong → coba lagi
 }
 throw new Error('Server tidak mengembalikan audio (kuota habis atau sedang sibuk). Tunggu sebentar lalu coba lagi.');
}
function toWav(parts,rate){
 const n=parts.reduce((s,p)=>s+p.length,0),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
 const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 new Int16Array(buf,44).set(new Int16Array(0));let o=44;
 for(const p of parts){for(let i=0;i<p.length;i++,o+=2)v.setInt16(o,p[i],true)}
 return{blob:new Blob([buf],{type:'audio/wav'}),sec:n/rate};
}

/* ---------- alur utama ---------- */
function setBusy(b){
 busy=b;const g=$('go');g.textContent=b?'Batalkan':'Hasilkan suara';g.classList.toggle('cancel',b);$('prog').hidden=!b;
 document.querySelectorAll('#script,#chars input,#chars select,#add,#tpl').forEach(e=>e.disabled=b);
}
async function generate(){
 if(busy){ac&&ac.abort();return}
 $('err').hidden=true;
 const key=$('key').value.trim();
 if(!key)return showErr('Masukkan API Key Gemini di panel kiri.');
 try{
  const names=S.chars.map(c=>c.name.trim().toLowerCase());
  if(names.some(n=>!n||/[:：]/.test(n)))throw new Error('Nama karakter tidak boleh kosong atau mengandung tanda titik dua.');
  if(new Set(names).size!==names.length)throw new Error('Nama karakter harus unik.');
  const segs=parse($('script').value);
  if(!segs.length)throw new Error('Naskah masih kosong.');
  const jobs=buildJobs(segs);
  setBusy(true);ac=new AbortController();
  const parts=[];let rate=24000;
  for(let i=0;i<jobs.length;i++){
   $('pbar').style.width=(i/jobs.length*100)+'%';$('ptxt').textContent=`Memproses bagian ${i+1} dari ${jobs.length}…`;
   const r=await tts(jobs[i],key,ac.signal);rate=r.rate;
   if(i)parts.push(new Int16Array(Math.round(rate*S.gap/1000)));
   parts.push(r.pcm);
  }
  $('pbar').style.width='100%';
  const {blob,sec}=toWav(parts,rate);
  curBlob=blob;const url=URL.createObjectURL(blob);
  $('player').src=url;$('out').hidden=false;$('player').play().catch(()=>{});
  hist.unshift({id:uid(),url,blob,txt:segs[0].text,date:new Date().toLocaleTimeString(),who:[...new Set(segs.map(s=>s.speaker))].join(', '),sec});
  renderHist();
 }catch(e){
  showErr(e.name==='AbortError'?'Proses dibatalkan.':e.message||'Terjadi kesalahan tak terduga.');
 }finally{setBusy(false);ac=null}
}
function dl(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderHist(){
 $('hist').hidden=!hist.length;
 $('hlist').innerHTML=hist.map(h=>`<div class="hi" data-id="${h.id}"><div class="t"><div class="a">${esc(h.txt)}</div><div class="m">${h.date} · ${esc(h.who)} · ${Math.round(h.sec)} dtk</div></div>
  <button class="btn" data-a="play" aria-label="Putar">▶</button><button class="btn" data-a="dl" aria-label="Unduh">⬇</button><button class="ico" data-a="rm" aria-label="Hapus">✕</button></div>`).join('');
}

/* ---------- event ---------- */
$('chars').addEventListener('input',e=>{
 const f=e.target.dataset.f,c=S.chars.find(x=>x.id===e.target.closest('.char')?.dataset.id);
 if(!f||!c)return;c[f]=e.target.value;if(f==='name')renderChips();save();
});
$('chars').addEventListener('click',e=>{
 if(!e.target.closest('[data-del]'))return;
 if(S.chars.length<=1)return showErr('Minimal harus ada 1 karakter.');
 S.chars=S.chars.filter(c=>c.id!==e.target.closest('.char').dataset.id);renderChars();save();
});
$('add').onclick=()=>{
 const used=S.chars.map(c=>c.name),v=VOICES.find(x=>!used.includes(x.n))||VOICES[0];
 let name=v.n,k=2;while(used.includes(name))name=v.n+k++;
 S.chars.push({id:uid(),name,voice:v.n,emo:'normal'});renderChars();save();
};
$('speed').onclick=e=>{const s=e.target.dataset.s;if(s){S.speed=s;fillSeg();save()}};
$('comma').onchange=e=>{S.comma=e.target.value;save()};
$('period').onchange=e=>{S.period=e.target.value;save()};
$('gap').onchange=e=>{S.gap=+e.target.value;save()};
$('tpl').onclick=()=>{$('script').value=template();stat();save()};
$('chips').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const t=$('script'),p=t.selectionStart,pre=t.value.slice(0,p);
 t.setRangeText((pre&&!pre.endsWith('\n')?'\n':'')+b.dataset.n+': ',p,t.selectionEnd,'end');t.focus();stat();save();
};
$('script').addEventListener('input',()=>{stat();save()});
$('script').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate()});
$('key').addEventListener('input',save);
$('go').onclick=generate;
$('dl').onclick=()=>curBlob&&dl(curBlob,`muntiqu_${Date.now()}.wav`);
$('hlist').onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const h=hist.find(x=>x.id===b.closest('.hi').dataset.id);if(!h)return;
 if(b.dataset.a==='play'){$('player').src=h.url;curBlob=h.blob;$('out').hidden=false;$('player').play()}
 else if(b.dataset.a==='dl')dl(h.blob,`muntiqu_${h.id}.wav`);
 else{URL.revokeObjectURL(h.url);hist=hist.filter(x=>x!==h);renderHist()}
};

load();fillSeg();renderChars();
if(!$('script').value.trim())$('script').value=template();
stat();
</script>
</body>
</html>
